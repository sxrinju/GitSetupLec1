name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Step 2: Detect the actor and update HTML
      - name: Show GitHub username
        run: echo "GitHub username is $GITHUB_ACTOR"

      - name: Update team leader HTML
        if: github.actor == 'sxrinju'
        run: |
          sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
          cat index.html

      # Step 3: Append an update log to README
      - name: Update README log
        if: github.actor == 'sxrinju'
        run: |
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
          tail -n 10 README.md
